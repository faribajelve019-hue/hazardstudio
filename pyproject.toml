[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hazardstudio-cli"
version = "0.1.0"
description = "Hazard Studio CLI"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0"
]

[project.scripts]
hazardstudio = "hazardstudio.cli:main"

[tool.setuptools]
packages = ["hazardstudio"]
